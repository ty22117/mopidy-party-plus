    <circle cx="27" cy="35" r="5.8" fill="#ffffff" fill-opacity=".55"/>
    <circle cx="39.5" cy="35" r="5.8" fill="#ffffff" fill-opacity=".55"/>
    <path d="M32.8 34.6 C33.2 33.4 33.6 33.4 33.7 34.6" fill="none"/>
