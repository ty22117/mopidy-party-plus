    <!-- big handlebar mustache with curled ends -->
    <path d="M33.2 44.2 C30.5 42.4 25.5 42.2 22.4 45.4 C20.6 47.2 17.4 47 17.2 44.2 C16 47.6 18.4 50.6 22.6 50 C26.6 49.4 30 48 33.2 47.6 C36.4 48 39.8 49.4 43.8 50 C48 50.6 50.4 47.6 49.2 44.2 C49 47 45.8 47.2 44 45.4 C40.9 42.2 35.9 42.4 33.2 44.2 Z" fill="#a8652f"/>
  </g>
  <!-- pupils -->
  <circle cx="28" cy="35.6" r="1.7" fill="#24170f"/>
  <circle cx="40.5" cy="35.6" r="1.7" fill="#24170f"/>
